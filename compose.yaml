# Curriculum Mapping Tool — Docker Compose
#
# Production (pull the prebuilt image):
#   docker compose up -d            -> http://localhost:8080
#
# Development (live-reloading Vite + API; needs a source checkout):
#   docker compose --profile dev up dev
#                                   -> http://localhost:5173
#
# Compose reads a sibling ".env" automatically for the ${...} values below.
# Copy .env.example to .env to change the port, pin an image tag, set the first
# admin's credentials, or configure SMTP.

services:
  web:
    # Multi-arch image published by .github/workflows/docker.yml on every push
    # to main. GHCR lowercases the owner (authorTom -> authortom).
    image: ${CMT_IMAGE:-ghcr.io/authortom/curriculum-mapping-tool:latest}

    # --- Build from source instead of pulling (optional) ------------------
    # Requires the full repo checkout on the host. Uncomment and run
    # `docker compose up -d --build` to build locally rather than pull.
    # build:
    #   context: .

    ports:
      - "${CMT_PORT:-8080}:8080"
    init: true                 # PID 1 signal forwarding + zombie reaping
    restart: unless-stopped

    environment:
      # Signs the session cookie. Leave unset and one is generated and kept in
      # the volume; set it to rotate the secret or to share it across replicas.
      SESSION_SECRET: "${SESSION_SECRET:-}"

      # On an empty database the app creates this admin and forces a password
      # change at first sign-in. Leave the password unset and a random one is
      # printed once to `docker compose logs web`.
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@localhost}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"

      # Load the abridged sample curricula and the demo accounts (all with the
      # published password "demo1234"). Off by default — only ever turn this on
      # for a throwaway evaluation instance that nobody else can reach.
      CMT_SEED_DEMO: "${CMT_SEED_DEMO:-false}"

      # Optional SMTP. Without it, notifications are written to the log instead.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      MAIL_FROM: "${MAIL_FROM:-Curriculum Mapping Tool <no-reply@localhost>}"
      APP_URL: "${APP_URL:-}"

    volumes:
      # The SQLite database (app.db) and the session secret. A named volume
      # survives `docker compose down` and image upgrades; swap in a host path
      # (e.g. ./data:/data) to keep them somewhere you can back up directly —
      # the host directory must be writable by uid 1000.
      - cmt-data:/data

    healthcheck:
      # Array (exec) form keeps the "://" and ":8080" out of YAML's way. busybox
      # wget ships in the node-alpine runtime image; there is no curl.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Containerised dev environment: mounts the working tree and runs the Vite dev
  # server alongside the API with hot reload, so no local Node install is needed.
  # Only works from a full source checkout (it bind-mounts "."). The API stays on
  # 3001 here because client/vite.config.js proxies /api to that port.
  dev:
    profiles: ["dev"]
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm ci --prefix client && npm run dev:docker"
    init: true
    environment:
      DATA_DIR: /data
      PORT: 3001
      CMT_SEED_DEMO: "true"     # demo data is useful when developing
    volumes:
      - .:/app
      # Named volumes keep container node_modules and dev data off the host tree.
      - node_modules:/app/node_modules
      - client_node_modules:/app/client/node_modules
      - cmt-dev-data:/data
    ports:
      - "5173:5173"   # Vite (the UI you open)
      - "3001:3001"   # API, proxied by Vite

volumes:
  cmt-data:
  cmt-dev-data:
  node_modules:
  client_node_modules:
